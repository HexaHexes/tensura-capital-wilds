# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.

# The Elves structure references `tensura:ancient_forest`, so the base mod must
# be present for the bundled worldgen to resolve.
[[dependencies.${mod_id}]]
modId = "tensura"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# This mod owns nothing at runtime: the central capital tags and the arrival
# behaviour belong to the spawn mod.
[[dependencies.${mod_id}]]
modId = "tensura_faction_spawn"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
